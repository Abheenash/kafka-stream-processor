name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (secrets)
        # Not gitleaks-action: it scans a commit RANGE (base^..head), and on a
        # repo's first push the base is the root commit, which has no parent —
        # git errors out and the job fails without scanning anything. Scanning
        # the tree directly works whatever the history looks like.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose --exit-code 1
  unit-tests:
    name: pytest (fake broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r tests/requirements.txt
      # No docker, no broker: the fake reproduces per-partition ordering,
      # committed offsets, lost commits and rebalance replay, which is everything
      # these tests assert.
      - run: python -m pytest tests -q

  iac-scan:
    name: checkov + terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: .checkov.yaml
      - uses: hashicorp/setup-terraform@v4
      - name: fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with: { tflint_version: v0.64.0 }
      - name: tflint
        working-directory: ${{ github.workspace }}
        # GITHUB_TOKEN is not optional here. `tflint --init` downloads the ruleset
        # plugins from the GitHub releases API, and unauthenticated that call shares
        # a rate limit with every other runner on the same egress IP -- so it works
        # until the day the account is busy, then fails with "403 API rate limit
        # exceeded" having linted nothing. That is exactly how it broke: merging a
        # batch of dependency PRs ran enough CI to exhaust it. The token is issued
        # to every workflow run automatically and needs no setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.8
          args: check --output-format github

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Requires "Dependency graph" enabled in repo settings, which a workflow
    # cannot turn on for itself. Non-blocking so a repo without it reports the
    # gap instead of failing every PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # The same processor, against a REAL broker. The unit tests prove the logic
  # against a fake; this proves the fake was faithful — that the adapter maps
  # confluent-kafka's surface correctly and that offset commits, redelivery and
  # DLQ writes behave the way the fake models them.
  integration:
    name: pytest (real broker)
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: redpandadata/redpanda:v25.2.5
        ports: ["9092:9092"]
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r tests/requirements.txt -r requirements.txt
      - run: python -m pytest tests/test_integration.py -v

# Local development against a real broker. Redpanda rather than Kafka + ZooKeeper
# because it is a single process, Kafka-API-compatible, and starts in about a
# second — which matters when the alternative is a three-container stack.
#
# The unit tests do NOT need this: they run against a fake broker that reproduces
# offsets, redelivery and rebalance. This is for exploring by hand.
services:
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 10
